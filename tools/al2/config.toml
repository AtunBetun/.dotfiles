min_version = "2026.11.0"
include = ["./common.toml"]

[settings]
auto_install = false
idiomatic_version_file_enable_tools = ["node", "python", "rust"]

# Amazon's AL2 artifacts preserve the corporate Node build on both architectures.
[tools."http:node"]
version = "22.21.1"
strip_components = 1
bin_path = "bin"

[tools."http:node".platforms]
linux-x64 = { url = "https://d3rnber7ry90et.cloudfront.net/linux-x86_64/node-v22.21.1.tar.gz" }
linux-arm64 = { url = "https://d3rnber7ry90et.cloudfront.net/linux-arm64/node-v22.21.1.tar.gz" }

# Build against the host libc and install the complete editor runtime in the tool directory.
[tools."http:neovim"]
version = "0.12.6"
url = "https://github.com/neovim/neovim/archive/022946c802832f938398dfae34b3f277ca9509d4.tar.gz"
strip_components = 1
bin_path = "install/bin"
postinstall = '''
set -eu
cd "$MISE_TOOL_INSTALL_PATH"
make CMAKE_BUILD_TYPE=Release CMAKE_INSTALL_PREFIX="$MISE_TOOL_INSTALL_PATH/install" install
'''
