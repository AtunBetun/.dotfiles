[tools]
"core:python" = "3.12.16"
"core:go" = "1.25.5"
"core:java" = "corretto-21.0.13.0.11"
"core:rust" = { version = "1.90.0", components = ["rustfmt", "rust-analyzer"] }
"github:herdrdev/herdr" = "0.9.5"
"aqua:junegunn/fzf" = "0.67.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:BurntSushi/ripgrep" = { version = "15.2.0", libc = "musl" }
"aqua:sharkdp/fd" = { version = "10.5.0", libc = "musl" }
"aqua:JohnnyMorganz/StyLua" = { version = "2.5.2", libc = "musl" }
"cargo:https://github.com/tree-sitter/tree-sitter" = { version = "tag:v0.26.1", crate = "tree-sitter-cli", bin = "tree-sitter", default-features = false, os = "linux" }
"github:tree-sitter/tree-sitter" = { version = "0.26.1", matching = "tree-sitter-", bin = "tree-sitter", os = "macos" }

[tools."http:git-credential-manager"]
version = "3.0.2"
bin_path = "."
os = "macos"

[tools."http:git-credential-manager".platforms]
macos-x64 = { url = "https://github.com/git-ecosystem/git-credential-manager/releases/download/v3.0.2/gcm-osx-x64-3.0.2.tar.gz", checksum = "sha256:a59672ed02fd5e785a4ff89a70890955a958015867995c1079023d3fbc6643b1" }
macos-arm64 = { url = "https://github.com/git-ecosystem/git-credential-manager/releases/download/v3.0.2/gcm-osx-arm64-3.0.2.tar.gz", checksum = "sha256:2031e8f81683ff0bd835a762e6cfd0831e9d28cdd5a55b10135c73e9498750cc" }
