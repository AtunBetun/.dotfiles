min_version = "2026.11.0"
include = ["./common.toml"]

[settings]
auto_install = false
self_update.auto = true
idiomatic_version_file_enable_tools = ["node", "python", "rust"]

[env]
_.path = { path = "{{ system_brew_prefix }}/bin", position = "append" }

[tools]
"core:node" = "22.22.2"
"aqua:neovim/neovim" = "0.12.6"
