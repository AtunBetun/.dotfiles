$mainMod = SUPER

# Applications and session control
bind = $mainMod, Return, exec, ghostty
bind = CTRL, Return, exec, ghostty
bind = $mainMod, Space, exec, noctalia msg panel-toggle launcher
bind = $mainMod, S, exec, noctalia msg panel-toggle control-center
bind = $mainMod, E, exec, nautilus --new-window
bind = $mainMod CTRL, L, exec, noctalia msg session lock
bind = $mainMod SHIFT, O, exec, noctalia msg panel-toggle session
bind = $mainMod SHIFT, Escape, exit
bind = $mainMod, C, exec, noctalia msg panel-toggle clipboard
bind = , Print, exec, ~/.local/bin/hypr-screenshot-full
bind = $mainMod, Print, exec, ~/.local/bin/hypr-screenshot-area

# Media controls remain available even when no application has focus.
bindl = , XF86AudioRaiseVolume, exec, noctalia msg volume-up
bindl = , XF86AudioLowerVolume, exec, noctalia msg volume-down
bindl = , XF86AudioMute, exec, noctalia msg volume-mute
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Workspaces match the AeroSpace workflow. S is the dedicated Slack workspace.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, D, workspace, name:D
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, D, movetoworkspace, name:D
bind = $mainMod, Tab, workspace, previous

# Directional focus and movement
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Window and layout actions
bind = $mainMod, W, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, Slash, layoutmsg, togglesplit
bind = $mainMod, V, togglefloating
bindm = $mainMod, mouse:272, movewindow
bind = $mainMod SHIFT, Comma, resizeactive, -50 0
bind = $mainMod SHIFT, Slash, resizeactive, 50 0
