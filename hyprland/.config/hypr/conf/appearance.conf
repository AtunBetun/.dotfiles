# Keep the desktop geometry stable so monitor-bound surfaces use the right size.
monitor = DP-2,2560x1440@143.97,0x0,1
monitor = HDMI-A-1,1920x1080@60,2560x0,1
monitor = ,preferred,auto,1

general {
    layout = dwindle
    gaps_in = 12
    gaps_out = 20
    border_size = 1
    col.active_border = rgb(fe8019) rgb(d3869b) 45deg
    col.inactive_border = rgb(665c54)
    resize_on_border = true
}

decoration {
    rounding = 14
    dim_inactive = false

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true

    bezier = calm, 0.2, 0.0, 0.0, 1.0
    animation = windows, 1, 3, calm, slide
    animation = workspaces, 1, 3, calm, slidevert
    animation = fade, 1, 2, calm
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

workspace = 1, monitor:DP-2, persistent:true
workspace = 2, monitor:DP-2, persistent:true
workspace = 3, monitor:DP-2, persistent:true
workspace = 4, monitor:DP-2, persistent:true
workspace = 5, monitor:DP-2, persistent:true
workspace = 6, monitor:HDMI-A-1, persistent:true
workspace = 7, monitor:HDMI-A-1, persistent:true
workspace = 8, monitor:HDMI-A-1, persistent:true
workspace = 9, monitor:HDMI-A-1, persistent:true
workspace = 10, monitor:HDMI-A-1, persistent:true
workspace = name:S, persistent:true
