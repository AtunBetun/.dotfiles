# Gruvbox shell for Hyprland. GUI changes are intentionally kept in
# ~/.local/state/noctalia rather than this stowed declarative configuration.

[theme]
mode = "dark"
source = "builtin"
builtin = "Gruvbox"

[shell]
font_family = "Inter"
setup_wizard_enabled = false
polkit_agent = true
clipboard_enabled = true
clipboard_history_max_entries = 100

[shell.animation]
enabled = true
speed = 1.0

[shell.shadow]
direction = "down"
alpha = 0.45

[shell.panel]
transparency_mode = "soft"
borders = true
shadow = true
launcher_placement = "floating"
launcher_position = "center"
control_center_placement = "attached"
session_placement = "attached"

[shell.launcher]
categories = true
show_icons = true
compact = false
app_grid = true
sort_by_usage = true

[bar]
order = ["main"]

[bar.main]
position = "top"
enabled = true
reserve_space = true
layer = "top"
thickness = 36
background_opacity = 0.96
border = "outline"
border_width = 1.0
radius = 12
margin_ends = 8
margin_edge = 6
padding = 12
widget_spacing = 6
hover_highlight = true
capsule = false
start = ["launcher", "workspaces"]
center = ["clock"]
end = ["media", "tray", "notifications", "group:connectivity", "battery", "control-center", "session"]

[[bar.main.capsule_group]]
id = "connectivity"
members = ["network", "bluetooth", "volume"]
fill = "surface_variant"
border = "outline"
padding = 6.0
opacity = 0.92

[control_center]
sidebar = "compact"
sidebar_section = "compact"
width = 720
hidden_tabs = ["weather", "screen-time"]

[dock]
enabled = true
position = "bottom"
active_monitor_only = true
icon_size = 44
background_opacity = 0.94
border = "outline"
border_width = 1.0
radius = 16
margin_ends = 0
margin_edge = 12
show_running = true
auto_hide = true
reserve_space = false
magnification = true
show_dots = true
launcher_position = "start"

[notification]
enable_daemon = true
show_app_name = true
show_actions = true
position = "top_right"
layer = "top"
background_opacity = 0.97
border = true
offset_x = 20
offset_y = 52

[osd]
position = "top_center"
background_opacity = 0.97
border = true
offset_y = 52

[audio]
enable_overdrive = false
enable_sounds = false

[wallpaper]
enabled = true
directory = "/home/atunbetun/.config/hypr/wallpapers"
fill_mode = "crop"
fill_color = "surface"
transition = ["fade"]
transition_duration = 500

[wallpaper.default]
path = "/home/atunbetun/.config/hypr/wallpapers/stella-wey.png"

[lockscreen]
enabled = true
blurred_desktop = true
blur_intensity = 0.5
tint_intensity = 0.3

[idle]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 300
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 330
action = "screen_off"
enabled = true
