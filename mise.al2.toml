[dotfiles.tools]
source = "tools/al2/config.toml"
variants = [{ default = true, target = "{{ mise_config_dir }}/config.toml" }]

[dotfiles.tools-lock]
source = "tools/al2/mise.lock"
variants = [{ default = true, target = "{{ mise_config_dir }}/mise.lock" }]

[tasks.install]
description = "Install pinned AL2 tools without changing live configuration"
env = { MISE_CONFIG_DIR = "{{ config_root }}/tools/al2", MISE_ENV = "", MISE_CEILING_PATHS = "{{ config_root }}" }
run = "mise install --locked"

[tasks.packages]
run = ["mise bootstrap packages apply", "sudo yum install -y zsh git gcc gcc-c++ make cmake3 clang-devel llvm-devel unzip"]
